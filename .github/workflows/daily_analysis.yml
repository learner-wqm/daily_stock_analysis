name: 每日股票分析

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: |
          pip install -r requirements.txt
          mkdir -p reports
      
      - name: 分析股票
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: python main.py
      
      - name: 推送到微信
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python3 << 'PYEOF'
import os
import requests
import glob

token = os.environ.get('PUSHPLUS_TOKEN')
if not token:
    print('PushPlus Token 未配置')
    exit(0)

# 查找最新报告
files = glob.glob('reports/*.md') or glob.glob('reports/*.txt')
if not files:
    print('未找到报告文件')
    exit(0)

latest = max(files, key=os.path.getctime)
print(f'找到报告: {latest}')

with open(latest, 'r', encoding='utf-8') as f:
    content = f.read()

# 截取前 8000 字符（PushPlus 限制）
if len(content) > 8000:
    content = content[:8000] + '\n\n... (报告已截断)'

# 发送到 PushPlus
url = 'http://www.pushplus.plus/send'
resp = requests.post(url, json={
    'token': token,
    'title': '📈 每日股票分析报告',
    'content': content,
    'template': 'txt'
}, timeout=30)

result = resp.json()
if result.get('code') == 200:
    print(f'✅ 推送成功')
else:
    print(f'❌ 推送失败: {result}')
PYEOF
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/