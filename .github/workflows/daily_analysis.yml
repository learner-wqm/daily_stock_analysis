name: 姣忔棩鑲＄エ鍒嗘瀽

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '杩愯妯″紡'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 闅忔満寤惰繜
        run: sleep $((RANDOM % 60))
      
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4
      
      - name: 璁剧疆 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 瀹夎渚濊禆
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 鍒涘缓鐩綍
        run: mkdir -p data logs reports
      
      - name: 鎵ц鑲＄エ鍒嗘瀽
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review
          else
            python main.py
          fi
      
      - name: 鍙戦€?Telegram 閫氱煡
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
import os
import requests
import glob

token = os.environ.get('TELEGRAM_BOT_TOKEN')
chat_id = os.environ.get('TELEGRAM_CHAT_ID')

if not token or not chat_id:
    print('Telegram 鏈厤缃?)
    exit(0)

files = glob.glob('reports/*.md')
if not files:
    print('鏈壘鍒版姤鍛?)
    exit(0)

latest = max(files, key=os.path.getctime)
with open(latest, 'r', encoding='utf-8') as f:
    content = f.read()[:4000]

if len(content) >= 4000:
    content += '\n\n... (宸叉埅鏂?'

url = f'https://api.telegram.org/bot{token}/sendMessage'
resp = requests.post(url, json={
    'chat_id': chat_id,
    'text': f'馃搱 鑲＄エ鍒嗘瀽鎶ュ憡\n\n{content}',
    'disable_web_page_preview': True
}, timeout=30)

result = resp.json()
if result.get('ok'):
    print(f'鍙戦€佹垚鍔? {result[\"result\"][\"message_id\"]}')
else:
    print(f'鍙戦€佸け璐? {result}')
"
      
      - name: 涓婁紶缁撴灉
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 7
      - name: Telegram通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -c "import os,requests,glob; t=os.environ.get('TELEGRAM_BOT_TOKEN'); c=os.environ.get('TELEGRAM_CHAT_ID'); f=glob.glob('reports/*.md'); f and f.sort(key=os.path.getctime); f and requests.post(f'https://api.telegram.org/bot{t}/sendMessage',json={'chat_id':c,'text':open(f[-1]).read()[:4000]+'...' if len(open(f[-1]).read())>4000 else open(f[-1]).read(),'disable_web_page_preview':True},timeout=30)"