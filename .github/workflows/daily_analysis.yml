name: 每日股票分析

on:
  # 定时任务 - 每天北京时间 18:00 (UTC 10:00)
  schedule:
    - cron: '0 10 * * 1-5'     # 周一到周五，UTC 10:00 = 北京时间 18:00
  
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+市场）
          - market-only   # 仅市场综述
          - stocks-only   # 仅股票分析

# 并发控制：同一时间只运行一个实例
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 随机延迟
        run: sleep $((RANDOM % 60))
      
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 创建目录
        run: mkdir -p data logs reports
      
      - name: 执行股票分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519' }}
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "运行模式: $MODE"
          
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review
          else
            python main.py
          fi
      
      - name: 发送 Telegram 通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram 未配置，跳过发送"
            exit 0
          fi
          
          echo "正在发送 Telegram 通知..."
          
          # 查找最新的报告文件
          REPORT_FILE=$(ls -t reports/*.md 2>/dev/null | head -1)
          
          if [ -z "$REPORT_FILE" ]; then
            echo "未找到报告文件"
            exit 0
          fi
          
          echo "找到报告: $REPORT_FILE"
          
          # 使用 Python 发送
          python3 << 'EOF'
import os
import requests

token = os.environ['TELEGRAM_BOT_TOKEN']
chat_id = os.environ['TELEGRAM_CHAT_ID']
thread_id = os.environ.get('TELEGRAM_MESSAGE_THREAD_ID')

# 读取报告
import glob
files = glob.glob('reports/*.md')
if not files:
    print("未找到报告文件")
    exit(0)

latest = max(files, key=os.path.getctime)
with open(latest, 'r', encoding='utf-8') as f:
    content = f.read()[:4000]

if len(content) >= 4000:
    content += "\n\n... (报告已截断)"

# 发送
url = f"https://api.telegram.org/bot{token}/sendMessage"
payload = {
    "chat_id": chat_id,
    "text": f"📈 股票分析报告\n\n{content}",
    "disable_web_page_preview": True
}

if thread_id:
    payload["message_thread_id"] = thread_id

resp = requests.post(url, json=payload, timeout=30)
result = resp.json()

if result.get("ok"):
    print(f"✅ 发送成功，Message ID: {result['result']['message_id']}")
else:
    print(f"❌ 发送失败: {result.get('description')}")
EOF
      
      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30